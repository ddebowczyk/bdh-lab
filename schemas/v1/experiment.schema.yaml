$schema: https://json-schema.org/draft/2020-12/schema
title: BDH Lab experiment v1
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - status
  - summary
  - hypothesis
  - assembly_id
  - profile_id
  - task
  - training
  - data
  - seeds
  - metrics
properties:
  schema_version:
    const: 1
  id:
    type: string
    pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  status:
    enum: [proposed, active, rejected, superseded, retired]
  summary:
    type: string
    minLength: 1
  hypothesis:
    type: object
    additionalProperties: false
    required: [claim, expected_effect, falsifier]
    properties:
      claim:
        type: string
        minLength: 1
      expected_effect:
        type: string
        minLength: 1
      falsifier:
        type: string
        minLength: 1
  lineage:
    type: object
    additionalProperties: false
    required: [basis]
    properties:
      basis:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      parent_experiment_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  assembly_id:
    type: string
    pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  profile_id:
    type: string
    pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  task:
    type: object
    additionalProperties: false
    required: [kind, config]
    properties:
      kind:
        enum:
          - synthetic_associative_recall_v1
          - synthetic_associative_recall_streaming_v1
      config:
        type: object
        additionalProperties: false
        required: [symbols, associations_per_sequence, batch_size]
        properties:
          symbols:
            type: integer
            minimum: 2
          associations_per_sequence:
            type: integer
            minimum: 1
          batch_size:
            type: integer
            minimum: 1
  training:
    type: object
    additionalProperties: false
    required: [steps, learning_rate, device]
    properties:
      steps:
        type: integer
        minimum: 1
      learning_rate:
        type: number
        exclusiveMinimum: 0
      device:
        enum: [auto, cpu, cuda, mps]
  data:
    type: object
    additionalProperties: false
    required: [training, validation_dataset_id, golden_evaluation_dataset_id]
    properties:
      training:
        type: object
        additionalProperties: false
        required: [kind, no_overlap_with]
        properties:
          kind:
            enum:
              - generated_synthetic_associative_recall_v1
              - generated_synthetic_associative_recall_streaming_v1
          no_overlap_with:
            type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
      validation_dataset_id:
        type: string
        pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
      golden_evaluation_dataset_id:
        type: string
        pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  seeds:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: integer
      minimum: 0
  metrics:
    type: object
    additionalProperties: false
    required: [primary]
    properties:
      primary:
        enum:
          - validation_query_accuracy
          - golden_evaluation_query_accuracy
          - validation_retained_state_query_accuracy
          - golden_evaluation_retained_state_query_accuracy
      threshold:
        type: number
        minimum: 0
        maximum: 1
  research_objective_id:
    type: string
    pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  budget:
    type: object
    additionalProperties: false
    required: [maximum_runtime_minutes, maximum_cost_usd]
    properties:
      maximum_runtime_minutes:
        type: integer
        minimum: 1
        maximum: 1440
      maximum_cost_usd:
        type: number
        exclusiveMinimum: 0
