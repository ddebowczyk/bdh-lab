$schema: https://json-schema.org/draft/2020-12/schema
title: BDH Lab research objective v1
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - status
  - question
  - decision
  - scope
  - gates
  - next_action
properties:
  schema_version:
    const: 1
  id:
    type: string
    pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  status:
    enum: [active, waiting, concluded, parked]
  question:
    type: string
    minLength: 1
  decision:
    type: string
    minLength: 1
  scope:
    type: object
    additionalProperties: false
    required: [includes, excludes]
    properties:
      includes:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      excludes:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  gates:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, status, exit_criteria, evidence]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
        status:
          enum: [pending, current, passed, failed]
        exit_criteria:
          type: string
          minLength: 1
        evidence:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [kind, path]
                properties:
                  kind:
                    enum: [source, test]
                  path:
                    type: string
                    minLength: 1
              - type: object
                additionalProperties: false
                required: [kind, experiment_id]
                properties:
                  kind:
                    const: experiment
                  experiment_id:
                    type: string
                    pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  next_action:
    type: object
    additionalProperties: false
    required: [kind, target, completion]
    properties:
      kind:
        enum: [source-assessment, implementation, experiment, decision]
      target:
        type: string
        minLength: 1
      completion:
        type: string
        minLength: 1
