$schema: https://json-schema.org/draft/2020-12/schema
title: BDH Lab execution profile v1
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - provider
  - summary
  - execution
  - artifacts
properties:
  schema_version:
    const: 1
  id:
    type: string
    pattern: '^[a-z][a-z0-9-]*-v[1-9][0-9]*$'
  provider:
    enum: [local, runpod]
  summary:
    type: string
    minLength: 1
  execution:
    type: object
    additionalProperties: true
    required: [kind]
    properties:
      kind:
        enum: [local, pod]
      device:
        enum: [auto, cpu, cuda, mps]
      command:
        const: runpodctl
      template_id:
        type: string
        minLength: 1
      template_id_environment:
        type: string
        pattern: '^[A-Z][A-Z0-9_]*$'
      pod:
        type: object
        additionalProperties: false
        required:
          - name_prefix
          - gpu_type_ids
          - volume_mount_path
          - cloud_type
          - public_ip
          - container_disk_gb
          - wait_timeout
        properties:
          name_prefix:
            type: string
            pattern: '^[a-z][a-z0-9-]*$'
          gpu_type_ids:
            type: array
            minItems: 1
            items:
              type: string
          min_cuda_version:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
          volume_mount_path:
            type: string
            pattern: '^/'
          cloud_type:
            enum: [SECURE, COMMUNITY]
          public_ip:
            type: boolean
          container_disk_gb:
            type: integer
            minimum: 1
          wait_timeout:
            type: string
            pattern: '^[1-9][0-9]*[smh]$'
      remote:
        type: object
        additionalProperties: false
        required: [checkout_path, python_command, uv_version]
        properties:
          checkout_path:
            type: string
            pattern: '^/[A-Za-z0-9._/-]+$'
          python_command:
            type: string
            minLength: 1
          uv_version:
            type: string
            pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  artifacts:
    type: object
    additionalProperties: false
    required: [local_root]
    properties:
      local_root:
        type: string
        minLength: 1
allOf:
  - if:
      properties:
        provider:
          const: runpod
    then:
      properties:
        execution:
          required: [kind, command, template_id, pod, remote]
