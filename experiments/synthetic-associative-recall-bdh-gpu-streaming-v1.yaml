schema_version: 1
id: synthetic-associative-recall-bdh-gpu-streaming-v1
status: active
summary: Three-seed BDH-GPU streaming reference comparison on fixed episodes.
hypothesis:
  claim: >-
    A fixed BDH-GPU rho state retains useful associations across calls while its
    per-example state size stays independent of episode length.
  expected_effect: >-
    Retained-state query accuracy exceeds reset-state query accuracy across
    three seeds and reports fixed state size.
  falsifier: >-
    The retained-state effect is absent, the state size grows with token count,
    or the three requested runs do not complete.
lineage:
  basis:
    - research/objectives/bdh-streaming-state-mechanism-v1.yaml
  parent_experiment_ids:
    - synthetic-associative-recall-bdh-gpu-streaming-smoke-v1
assembly_id: bdh-gpu-streaming-reference-v1
profile_id: local-cpu-v1
task:
  kind: synthetic_associative_recall_streaming_v1
  config:
    symbols: 8
    associations_per_sequence: 3
    batch_size: 16
training:
  steps: 512
  learning_rate: 0.003
  device: cpu
data:
  training:
    kind: generated_synthetic_associative_recall_streaming_v1
    no_overlap_with:
      - synthetic-associative-recall-streaming-s8-a3-validation-v1
      - synthetic-associative-recall-streaming-s8-a3-golden-evaluation-v1
  validation_dataset_id: synthetic-associative-recall-streaming-s8-a3-validation-v1
  golden_evaluation_dataset_id: synthetic-associative-recall-streaming-s8-a3-golden-evaluation-v1
seeds: [11, 17, 23]
metrics:
  primary: golden_evaluation_retained_state_query_accuracy
research_objective_id: bdh-streaming-state-mechanism-v1
