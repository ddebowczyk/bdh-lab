schema_version: 1
id: synthetic-associative-recall-bdh-gpu-streaming-runpod-v2
status: active
summary: Bounded CUDA measurement with current GPU selection and visibility gates.
hypothesis:
  claim: >-
    A current Runpod GPU type with CUDA 13.0 compatibility exposes CUDA before
    and after environment synchronization, then runs the streaming reference.
  expected_effect: >-
    Three completed CUDA records and one Pod-scoped cost record are retrieved
    within the declared runtime and projected-cost limits.
  falsifier: >-
    CUDA visibility, execution, retrieval, cleanup, or cost collection fails;
    or the returned hourly rate exceeds the cap.
lineage:
  basis:
    - research/evidence/bdh-gpu-streaming-local-v1.md
    - research/evidence/bdh-gpu-streaming-runpod-v1-failure.md
  parent_experiment_ids:
    - synthetic-associative-recall-bdh-gpu-streaming-runpod-v1
assembly_id: bdh-gpu-streaming-reference-v1
profile_id: runpod-pod-v2
task:
  kind: synthetic_associative_recall_streaming_v1
  config:
    symbols: 8
    associations_per_sequence: 3
    batch_size: 16
training:
  steps: 512
  learning_rate: 0.003
  device: cuda
data:
  training:
    kind: generated_synthetic_associative_recall_streaming_v1
    no_overlap_with:
      - synthetic-associative-recall-streaming-s8-a3-validation-v1
      - synthetic-associative-recall-streaming-s8-a3-golden-evaluation-v1
  validation_dataset_id: synthetic-associative-recall-streaming-s8-a3-validation-v1
  golden_evaluation_dataset_id: synthetic-associative-recall-streaming-s8-a3-golden-evaluation-v1
