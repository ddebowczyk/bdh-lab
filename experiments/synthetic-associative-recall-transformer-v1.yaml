schema_version: 1
id: synthetic-associative-recall-transformer-v1
status: active
summary: Causal Transformer control for a larger synthetic associative-recall run.
hypothesis:
  claim: The causal Transformer provides a full-context control on this task.
  expected_effect: It establishes a reproducible accuracy and loss reference.
  falsifier: It cannot complete the declared task or record a valid control result.
lineage:
  basis:
    - Initial full-context control experiment.
assembly_id: transformer-recall-v1
profile_id: local-cpu-v1
task:
