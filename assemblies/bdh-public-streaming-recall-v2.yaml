components:
  - role: representation
    component_id: representation-token-embedding-v1
  - role: activation
    component_id: activation-positive-relu-v1
  - role: recurrent-memory
    component_id: memory-bdh-public-rope-rho-v1
implementation:
  kind: bdh_public_streaming_recall_v1
  config:
    hidden_size: 16
    heads: 2
    layers: 2
    mlp_internal_dim_multiplier: 4
