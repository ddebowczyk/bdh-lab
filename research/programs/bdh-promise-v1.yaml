schema_version: 1
id: bdh-promise-v1
status: concluded
title: BDH public-baseline and long-stream promise program
question: >-
  Does a public-BDH-GPU-conformant streaming variant provide a useful
  long-context quality, memory, and runtime trade-off?
decision: >-
  Continue toward language-scale study only if public conformance and a
  controlled long-stream comparison show a material retained-state benefit.
